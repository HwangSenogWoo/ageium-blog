name: DIO Rust Offline Toolchain Cache

on:
  push:
    branches:
      - dio-rust-cache-20260929

permissions:
  contents: read

jobs:
  build-offline-cache:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euxo pipefail
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
          rustc --version
          cargo --version

      - name: Materialize dependency manifest
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p cache-input/src
          cat > cache-input/Cargo.toml <<'CARGO_EOF'
          [package]
          name = "dio-remote-hands"
          version = "1.0.0-rc.5"
          edition = "2021"
          description = "DIO Sovereign Local Runtime - single dio.run JIT capability broker"
          
          [dependencies]
          tokio = { version = "1.38", features = ["full"] }
          tokio-stream = "0.1"
          axum = { version = "0.7", features = ["json", "tokio"] }
          serde = { version = "1.0", features = ["derive"] }
          serde_json = "1.0"
          reqwest = { version = "0.12", features = ["json"] }
          rusqlite = { version = "0.31", features = ["bundled"] }
          chrono = { version = "0.4", features = ["serde"] }
          uuid = { version = "1.8", features = ["v4", "serde"] }
          clap = { version = "4.5", features = ["derive"] }
          toml = "0.8"
          tracing = "0.1"
          tracing-subscriber = { version = "0.3", features = ["env-filter"] }
          anyhow = "1.0"
          base64 = "0.22"
          sha2 = "0.10"
          windows-service = "0.7"
          
          [dev-dependencies]
          tempfile = "3.10"
          
          [workspace]
                    CARGO_EOF
          printf '%s' '' | base64 -d | gunzip > cache-input/Cargo.lock
          : > cache-input/src/lib.rs
          cargo fetch --locked --manifest-path cache-input/Cargo.toml

      - name: Build offline sandbox payload
        shell: bash
        run: |
          set -euxo pipefail
          SYSROOT="$(rustc --print sysroot)"
          mkdir -p payload/toolchain payload/cargo-home
          cp -a "$SYSROOT"/. payload/toolchain/
          cp -a "$HOME/.cargo/registry" payload/cargo-home/
          if [ -d "$HOME/.cargo/git" ]; then cp -a "$HOME/.cargo/git" payload/cargo-home/; fi
          {
            rustc --version
            cargo --version
            echo "host=$(rustc -vV | sed -n 's/^host: //p')"
          } > payload/VERSIONS.txt
          tar -C payload -czf rust-offline-x86_64-unknown-linux-gnu-1.85.0.tgz .
          sha256sum rust-offline-x86_64-unknown-linux-gnu-1.85.0.tgz > rust-offline-x86_64-unknown-linux-gnu-1.85.0.tgz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: rust-offline-x86_64-unknown-linux-gnu-1.85.0
          path: |
            rust-offline-x86_64-unknown-linux-gnu-1.85.0.tgz
            rust-offline-x86_64-unknown-linux-gnu-1.85.0.tgz.sha256
          retention-days: 1
          compression-level: 0
