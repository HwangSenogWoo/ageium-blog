name: DIO Rust 1.88 Offline Toolchain

on:
  push:
    branches:
      - dio-rust-cache-20260929

permissions:
  contents: read

jobs:
  build-toolchain:
    runs-on: ubuntu-24.04
    steps:
      - name: Install minimum compatible Rust
        shell: bash
        run: |
          set -euxo pipefail
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustc --version
          cargo --version

      - name: Package toolchain
        shell: bash
        run: |
          set -euxo pipefail
          SYSROOT="$(rustc --print sysroot)"
          mkdir -p payload/toolchain
          cp -a "$SYSROOT"/. payload/toolchain/
          {
            rustc --version
            cargo --version
            echo "host=$(rustc -vV | sed -n 's/^host: //p')"
          } > payload/VERSIONS.txt
          tar -C payload -czf rust-toolchain-x86_64-unknown-linux-gnu-1.88.0.tgz .
          sha256sum rust-toolchain-x86_64-unknown-linux-gnu-1.88.0.tgz > rust-toolchain-x86_64-unknown-linux-gnu-1.88.0.tgz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: rust-toolchain-x86_64-unknown-linux-gnu-1.88.0
          path: |
            rust-toolchain-x86_64-unknown-linux-gnu-1.88.0.tgz
            rust-toolchain-x86_64-unknown-linux-gnu-1.88.0.tgz.sha256
          retention-days: 1
          compression-level: 0
