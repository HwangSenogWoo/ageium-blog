name: AGEIUM Growth OS public-origin E2E
on:
  push:
    branches: [dio-growth-os-commission-20260825]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-e2e:
    runs-on: ubuntu-latest
    env:
      BASE: https://rawcdn.githack.com/HwangSenogWoo/ageium-blog/975c2f4495340bf62314a98def6eaf1ae0f018ef/
    steps:
      - name: Verify public-origin exact bytes
        run: |
          set -euo pipefail
          curl -fsSL "${BASE}index.html" -o /tmp/index.html
          curl -fsSL "${BASE}app.js" -o /tmp/app.js
          curl -fsSL "${BASE}styles.css" -o /tmp/styles.css
          curl -fsSL "${BASE}curriculum.json" -o /tmp/curriculum.json
          curl -fsSL "${BASE}manifest.webmanifest" -o /tmp/manifest.webmanifest
          curl -fsSL "${BASE}sw.js" -o /tmp/sw.js
          curl -fsSL "${BASE}source_provenance.json" -o /tmp/source_provenance.json
          echo "83be18e3823c833586fd4e390aea2f455a3d2f11ae33d7e52d75a3180090d01e  /tmp/index.html" | sha256sum -c -
          echo "160faa515ecc667a4eb6e85e82e93a1a91c09c4f803014315718d53ad3d9d8c1  /tmp/app.js" | sha256sum -c -
          echo "20fcacc773185023433f21758ad1cee7e5146c2e2087fdde45ebc1fa88a5dabd  /tmp/styles.css" | sha256sum -c -
          echo "3d22d4b100965a5a73f594aeb83a4d1b63a7c3d1ac1dffbcd52a8d539ecff012  /tmp/curriculum.json" | sha256sum -c -
          echo "6a0b6d61bb2b9addc775e68a8e6f14f42f2b354888ce67079346133a6c4d7f30  /tmp/manifest.webmanifest" | sha256sum -c -
          echo "01372b67e149c14ac12c18dd7932ef265357fbf884333ed8b243eda2923babfa  /tmp/sw.js" | sha256sum -c -
          echo "f639d09baaaacdea7e2c09de71cd154fa7a975fb058b70e7d181edbcdb18903c  /tmp/source_provenance.json" | sha256sum -c -
      - name: Install browser harness
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run real-origin Chromium E2E
        run: |
          cat > e2e.js <<'NODE'
          const { chromium } = require('playwright');
          const assert = (c,m) => { if(!c) throw new Error(m); };
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844},acceptDownloads:true});
            const page=await context.newPage();
            const errors=[];
            page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
            page.on('pageerror',e=>errors.push('page:'+e.message));
            const base=process.env.BASE;
            await page.goto(base,{waitUntil:'networkidle',timeout:60000});
            assert(await page.locator('#onboarding').evaluate(e=>e.open),'onboarding_not_open');
            await page.locator('#goalInput').fill('집중력을 높이고 싶다');
            await page.locator('#whyInput').fill('매일 중요한 일을 끝내고 싶다');
            await page.locator('#windowInput').selectOption('morning');
            await page.locator('#onboardingForm button[value="save"]').click();
            await page.waitForTimeout(300);
            assert((await page.locator('#actionText').innerText()).trim().length>0,'action_missing');
            await page.locator('button[data-nav="learn"]').last().click();
            await page.waitForTimeout(200);
            assert(await page.locator('.card').count()===45,'chapter_count_not_45');
            await page.locator('#searchInput').fill('딥워크');
            assert(await page.locator('.card').count()>0,'search_empty');
            await page.locator('.card').first().click();
            assert(await page.locator('#reader').evaluate(e=>e.open),'reader_not_open');
            assert((await page.locator('#readerBody').innerText()).length>500,'reader_body_too_short');
            await page.locator('#readerClose').click();
            await page.locator('button[data-nav="today"]').last().click();
            await page.locator('#shrinkBtn').click();
            assert((await page.locator('#actionMinutes').innerText()).includes('90초'),'shrink_not_90');
            await page.locator('#startBtn').click();
            assert(await page.locator('#timerPanel').isVisible(),'timer_not_visible');
            await page.locator('#doneBtn').click();
            assert((await page.locator('#totalDone').innerText()).trim()==='1','done_not_recorded');
            await page.locator('button[data-nav="genome"]').last().click();
            assert((await page.locator('#bestWindow').innerText()).includes('아침'),'genome_window_missing');
            assert(await page.locator('.memory-item').count()>=2,'memory_not_recorded');
            const stored=await page.evaluate(()=>localStorage.getItem('ageium_growth_os_v1'));
            assert(stored && stored.includes('집중력을 높이고 싶다'),'localstorage_missing');
            const sw=await page.evaluate(async()=>{
              if(!('serviceWorker' in navigator)) return {supported:false};
              const r=await Promise.race([navigator.serviceWorker.ready,new Promise((_,rej)=>setTimeout(()=>rej(new Error('sw_timeout')),15000))]);
              return {supported:true,active:!!r.active,scope:r.scope};
            });
            assert(sw.supported&&sw.active,'service_worker_not_active');
            await page.reload({waitUntil:'networkidle'});
            assert(await page.evaluate(()=>!!navigator.serviceWorker.controller),'service_worker_not_controlling');
            await context.setOffline(true);
            await page.reload({waitUntil:'domcontentloaded',timeout:30000});
            assert((await page.title()).includes('1% Growth OS'),'offline_shell_failed');
            assert((await page.locator('#chapterGrid').count())===1,'offline_dom_failed');
            await context.setOffline(false);
            assert(errors.length===0,'browser_errors:'+errors.join('|'));
            console.log(JSON.stringify({decision:'PASS',public_origin:base,chapter_count:45,local_storage:true,service_worker:sw,offline_reload:true,console_errors:errors},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node e2e.js
