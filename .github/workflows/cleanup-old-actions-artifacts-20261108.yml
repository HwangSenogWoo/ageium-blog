name: One-time cleanup of legacy Actions artifacts

on:
  push:
    branches:
      - housekeeping/purge-old-actions-artifacts-20261108

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-old-artifacts-20261108
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository_owner == 'HwangSenogWoo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inventory and delete only pre-November artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CUTOFF: '2026-11-01T00:00:00Z'
        run: |
          set -euo pipefail
          umask 077
          manifest="$RUNNER_TEMP/artifacts-before.json"
          target="$RUNNER_TEMP/artifacts-to-delete.tsv"
          after="$RUNNER_TEMP/artifacts-after.json"

          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" > "$manifest"
          jq -r --arg cutoff "$CUTOFF" '
            .[] | .artifacts[]?
            | select(.created_at < $cutoff and .expired != true)
            | [.id, .size_in_bytes, .created_at] | @tsv
          ' "$manifest" > "$target"

          count=$(wc -l < "$target")
          bytes=$(awk -F '\t' '{s += $2} END {printf "%.0f", s+0}' "$target")
          echo "Eligible legacy artifacts: ${count}; bytes: ${bytes}; cutoff: ${CUTOFF}"
          echo "Current and November artifacts are excluded. Workflow runs, logs, source, caches, and Packages are untouched."

          deleted=0
          while IFS=$'\t' read -r id size created; do
            [[ "$id" =~ ^[0-9]+$ ]] || { echo 'Refusing invalid artifact ID'; exit 1; }
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" > /dev/null
            echo "Deleted artifact ${id} (${size} bytes; ${created})"
            deleted=$((deleted+1))
          done < "$target"
          echo "Delete calls completed: ${deleted}"

          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" > "$after"
          remaining=$(jq --arg cutoff "$CUTOFF" '
            [.[] | .artifacts[]? | select(.created_at < $cutoff and .expired != true)] | length
          ' "$after")
          echo "Remaining eligible legacy artifacts: ${remaining}"
          test "$remaining" -eq 0
